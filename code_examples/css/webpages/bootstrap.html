<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Example</title>

    <!--
      Bootstrap is a CSS framework, so unlike the other examples it cannot
      be included as a fully internal stylesheet -- it must be loaded from
      a CDN (or a local copy) as an external stylesheet. Any custom
      overrides on top of Bootstrap are still included internally below,
      following the same pattern as the other examples.
    -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* Best practice: use Bootstrap's utility classes (like d-flex, mt-3,
           text-center) for small adjustments instead of writing custom CSS
           that duplicates what Bootstrap already provides. Only add custom
           rules here for things Bootstrap doesn't already cover. */
        body {
            padding-top: 24px;
        }
    </style>
</head>
<body>
    <!-- Bootstrap's grid system uses a 12-column layout with responsive classes -->
    <div class="container">
        <div class="row">
            <!-- col-md-8: takes 8/12 columns on medium screens and up -->
            <div class="col-md-8">
                <h1>Main Content</h1>
                <p>This column takes up most of the width on medium+ screens.</p>
            </div>
            <!-- col-md-4: takes 4/12 columns on medium screens and up -->
            <div class="col-md-4">
                <h2>Sidebar</h2>
                <p>This column stacks below the main content on small screens.</p>
            </div>
        </div>

        <!-- Bootstrap components come with pre-built styling and behavior -->
        <button type="button" class="btn btn-primary">Primary Button</button>

        <div class="alert alert-warning mt-3" role="alert">
            This is a pre-styled Bootstrap alert component.
        </div>

        <div class="d-flex justify-content-between mt-3">
            <span>Left item</span>
            <span>Right item</span>
        </div>
    </div>

    <!-- Include Bootstrap's JS bundle before closing </body> tag
         if using interactive components like modals or dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
