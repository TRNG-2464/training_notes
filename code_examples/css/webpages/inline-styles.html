<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inline Styles</title>
</head>
<body>
    <!-- CSS Properties use a key:value pair 
     Below the properties styled are:
     background-color
     font-famimly
     color
     font-size
     -->
    <p style="background-color: coral; 
        font-family:'Times New Roman', Times, serif; 
        color: purple; 
        font-size: 20pt;">This is my paragraph</p>

    <p style="background-color: skyblue; 
        font-family:'Times New Roman', Times, serif; 
        color: crimson; 
        font-size: 36pt;">Paragraph 2</p>
</body>
</html>
