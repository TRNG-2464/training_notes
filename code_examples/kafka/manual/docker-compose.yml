services:
 kafka-1:
   image: apache/kafka:latest
   ports:
     - "9092:9092"
   environment:
     KAFKA_NODE_ID: 1
     KAFKA_PROCESS_ROLES: broker,controller
     KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092, INTERNAL://kafka-1:19092
     KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

 kafka-2:
   image: apache/kafka:latest
   ports:
     - "9094:9094"
   environment:
     KAFKA_NODE_ID: 2
     KAFKA_PROCESS_ROLES: broker,controller
     KAFKA_LISTENERS: PLAINTEXT://:9094,INTERNAL://:19094,CONTROLLER://:9093
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094, INTERNAL://kafka-2:19094
     KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

 kafka-3:
   image: apache/kafka:latest
   ports:
     - "9095:9095"
   environment:
     KAFKA_NODE_ID: 3
     KAFKA_PROCESS_ROLES: broker,controller
     KAFKA_LISTENERS: PLAINTEXT://:9095,INTERNAL://:19095,CONTROLLER://:9093
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095, INTERNAL://kafka-3:19095
     KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093 