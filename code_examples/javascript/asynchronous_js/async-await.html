<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Lookup Util</title>
  <style>
    /* 
        This example leveraged AI (Claude) to generate the CSS as well as the
        code to populate pokemon data onto the HTML page
    */
    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    /* ---- Layout ---- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 36px;
      width: 100%;
      max-width: 640px;
    }

    /* ---- Header ---- */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* ---- Form ---- */
    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus  { border-color: #6366f1; }
    input[type="text"]::placeholder { color: #9ca3af; }

    button {
      padding: 10px 20px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    button:hover   { background: #4f46e5; }
    button:active  { background: #4338ca; }
    button:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    /* ---- Status messages ---- */
    .status {
      font-size: 0.88rem;
      min-height: 20px;
      margin-bottom: 16px;
      padding: 0 2px;
    }

    .status.loading { color: #6366f1; }
    .status.error   { color: #ef4444; }
    .status.success { color: #10b981; }

    /* ---- Pokémon result panel ---- */
    .result-panel {
      display: none;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
      padding: 16px;
      background: #f8f8ff;
      border-radius: 10px;
      border: 1px solid #e0e7ff;
    }

    .result-panel.visible { display: flex; }

    /* Sprite image loaded from Blob */
    #pokemon-sprite {
      width: 96px;
      height: 96px;
      image-rendering: pixelated; /* Keeps the sprite crisp at larger sizes */
      flex-shrink: 0;
    }

    .pokemon-name {
      font-size: 1.3rem;
      font-weight: 700;
      text-transform: capitalize;
      color: #1a1a2e;
    }

    .type-badges { margin-top: 6px; }

    /* ---- Type badge ---- */
    .type-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: capitalize;
      margin-right: 4px;
      color: #fff;
      background: #6b7280;
    }

    .type-fire     { background: #f97316; }
    .type-water    { background: #3b82f6; }
    .type-grass    { background: #22c55e; }
    .type-electric { background: #eab308; color: #1a1a2e; }
    .type-psychic  { background: #ec4899; }
    .type-ice      { background: #67e8f9; color: #1a1a2e; }
    .type-dragon   { background: #7c3aed; }
    .type-dark     { background: #374151; }
    .type-fairy    { background: #f9a8d4; color: #1a1a2e; }
    .type-normal   { background: #9ca3af; }
    .type-fighting { background: #b45309; }
    .type-flying   { background: #93c5fd; color: #1a1a2e; }
    .type-poison   { background: #a855f7; }
    .type-ground   { background: #d97706; }
    .type-rock     { background: #78716c; }
    .type-bug      { background: #84cc16; color: #1a1a2e; }
    .type-ghost    { background: #6d28d9; }
    .type-steel    { background: #94a3b8; }

    /* ---- Results Table ---- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    thead tr { background: #f0f0ff; }

    th {
      text-align: left;
      padding: 10px 14px;
      font-weight: 600;
      color: #4338ca;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 2px solid #e0e7ff;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f1f1;
      color: #374151;
      text-transform: capitalize;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td      { background: #fafafa; }

    /* ---- Empty state ---- */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <header>
      <h1>Pokémon Lookup</h1>
      <p>Demonstrates async / await and loading an image as a Blob</p>
    </header>

    <!-- Search form -->
    <div class="form-row">
      <input
        type="text"
        id="pokemon-input"
        placeholder="Enter a Pokémon name (e.g. gengar)"
      />
      <button id="search-btn">Search</button>
    </div>

    <!-- Status message (loading / error / success) -->
    <p class="status" id="status-msg"></p>

    <!-- Result panel — sprite image + name + type badges -->
    <div class="result-panel" id="result-panel">
      <img id="pokemon-sprite" alt="Pokémon sprite" />
      <div>
        <div class="pokemon-name" id="pokemon-name"></div>
        <div class="type-badges" id="type-badges"></div>
      </div>
    </div>

    <!-- Details table -->
    <div id="results-container">
      <div class="empty-state" id="empty-state">
        Search for a Pokémon to see its details here.
      </div>

      <table id="results-table" style="display: none;">
        <thead>
          <tr>
            <th>Field</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function getPokemon(name) {
      const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);

      // fetch() does NOT reject on HTTP errors response.ok must be checked manually
      if (!response.ok) {
        throw new Error(`Pokémon not found (Status: ${response.status})`);
      }

      const data = await response.json(); // await the JSON parsing it is also async

      return {
        name:      data.name,
        id:        data.id,
        height:    `${data.height * 10} cm`,   // PokeAPI returns decimetres
        weight:    `${data.weight / 10} kg`,   // PokeAPI returns hectograms
        types:     data.types.map((t) => t.type.name),
        spriteUrl: data.sprites.front_default, // URL used to fetch the Blob below
      };
    }

    // getSpriteBlobUrl fetches the sprite image as a Blob
    // and converts it to a local object URL the <img> can use as its src
    async function getSpriteBlobUrl(spriteUrl) {
      const response = await fetch(spriteUrl);
      const blob     = await response.blob();           // Read the response body as a Blob
      return URL.createObjectURL(blob);                 // Convert Blob to a temporary local URL
    }

    // UI helpers
    const input        = document.getElementById("pokemon-input");
    const searchBtn    = document.getElementById("search-btn");
    const statusMsg    = document.getElementById("status-msg");
    const emptyState   = document.getElementById("empty-state");
    const resultsTable = document.getElementById("results-table");
    const resultsBody  = document.getElementById("results-body");
    const resultPanel  = document.getElementById("result-panel");
    const pokemonName  = document.getElementById("pokemon-name");
    const typeBadges   = document.getElementById("type-badges");
    const spriteImg    = document.getElementById("pokemon-sprite");

    // Track the previous Blob URL so it can be revoked when a new search runs,
    // freeing up the memory it was holding
    let currentBlobUrl = null;

    function setStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className   = `status ${type}`;
    }

    function hideResults() {
      resultPanel.classList.remove("visible");
      resultsTable.style.display = "none";
      emptyState.style.display   = "block";
    }

    function showResults(pokemon, blobUrl) {
      // ---- Sprite panel ----
      // Revoke the previous Blob URL before assigning the new one
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }
      currentBlobUrl  = blobUrl;
      spriteImg.src   = blobUrl; // The <img> src points to the local Blob URL, not the remote URL
      spriteImg.alt   = pokemon.name;

      pokemonName.textContent = pokemon.name;

      typeBadges.innerHTML = pokemon.types
        .map((t) => `<span class="type-badge type-${t}">${t}</span>`)
        .join("");

      resultPanel.classList.add("visible");

      // ---- Details table ----
      resultsBody.innerHTML = `
        <tr><td>ID</td>     <td>#${String(pokemon.id).padStart(3, "0")}</td></tr>
        <tr><td>Height</td> <td>${pokemon.height}</td></tr>
        <tr><td>Weight</td> <td>${pokemon.weight}</td></tr>
        <tr><td>Type(s)</td><td>${pokemon.types.join(", ")}</td></tr>
      `;

      emptyState.style.display   = "none";
      resultsTable.style.display = "table";
    }

    
    /* The handleSearch function coordinates both requests
        Awaits getPokemon() first, then awaits getSpriteBlobUrl()
        try/catch handles errors from either await in one place
        finally re-enables the button regardless of outcome
    */
    async function handleSearch() {
      const name = input.value.trim().toLowerCase();

      if (!name) {
        setStatus("Please enter a Pokémon name.", "error");
        return;
      }

      // Disable the button and show loading state while requests are in flight
      searchBtn.disabled    = true;
      searchBtn.textContent = "Searching...";
      setStatus("Loading...", "loading");
      hideResults();

      try {
        // await the Pokémon data any error here throws to the catch block
        const pokemon = await getPokemon(name);

        // await the sprite Blob URL runs only after getPokemon() resolves
        const blobUrl = await getSpriteBlobUrl(pokemon.spriteUrl);

        // Both awaits resolved populate the UI
        setStatus(`Found: ${pokemon.name}`, "success");
        showResults(pokemon, blobUrl);

      } catch (error) {
        // Handles errors from either getPokemon() or getSpriteBlobUrl()
        setStatus(error.message, "error");

      } finally {
        // Always runs re-enable the button whether the request succeeded or failed
        searchBtn.disabled    = false;
        searchBtn.textContent = "Search";
      }
    }

    // Trigger search on button click
    searchBtn.addEventListener("click", handleSearch);

    // Also trigger search on Enter key inside the input
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") handleSearch();
    });
  </script>

</body>
</html>
